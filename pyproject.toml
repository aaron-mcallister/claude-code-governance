# Tool configuration only. This repository is a set of standalone scripts, not an installable package.
[tool.ruff]
line-length = 110
target-version = "py39"   # the hook must run on the Python that ships with macOS developer tools

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = [
  "UP037",  # quoted annotations are deliberate: they keep py39 from evaluating `X | Y`
  "S603", "S607",  # tests run the hook and linter as subprocesses on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "E501"]
"policy/hooks/ccg_guard.py" = ["S105", "S102", "E501"]
"tools/ccg_lint.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
